name: Bug report
description: Something is broken or behaves unexpectedly in py-bragerone.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        **Security issues must not be filed here.** Use [private vulnerability reporting](https://github.com/marpi82/py-bragerone/security/advisories/new) or email `marpi82.dev@google.com` (see [SECURITY.md](https://github.com/marpi82/py-bragerone/blob/main/SECURITY.md)).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the problem.
      placeholder: e.g. ParamStore drops P4.u1 after a WS reconnect when the delta omits the unit channel.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (include error messages / traceback if any).
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal, numbered steps. Prefer a short async snippet using the public API (`BragerOneApiClient` / `BragerOneGateway`).
      placeholder: |
        1. …
        2. …
        3. …
      render: markdown
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions and platform details that help triage.
      value: |
        - py-bragerone version / git SHA:
        - Python version:
        - Platform (bragerone / tisconnect):
        - OS:
        - Home Assistant version (if relevant):
        - ha-bragerone version (if relevant):
      render: markdown
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the library is involved?
      multiple: true
      options:
        - REST client (`BragerOneApiClient`)
        - WebSocket / realtime (`RealtimeManager`)
        - Gateway (`BragerOneGateway`)
        - EventBus / ParamStore
        - LiveAssetsCatalog / tree-sitter parsers
        - ParamResolver / menus / i18n
        - CLI
        - Docs
        - CI / packaging
        - Other / unsure
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
        - label: I can reproduce this offline with mocks / fixtures when practical (live cloud is optional).
          required: false
