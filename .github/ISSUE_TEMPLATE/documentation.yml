name: Documentation
description: Docs are wrong, missing, unclear, or out of date relative to the code.
title: "docs: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Docs live under `docs/` (Sphinx + Furo) and must describe the code as it is. Docs↔code drift in either direction is a defect.

        Published site: https://marpi82.github.io/py-bragerone/

  - type: textarea
    id: summary
    attributes:
      label: What is wrong or missing?
      description: Page / section, and what you expected to find.
      placeholder: e.g. docs/reference/ha_integration.rst still documents X after it was removed from __all__.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Proposed wording, structure, or examples (optional).
    validations:
      required: false

  - type: input
    id: link
    attributes:
      label: Link / path
      description: URL or repo path to the affected page.
      placeholder: docs/guides/getting_started.rst
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked the latest docs on GitHub Pages / this repo’s `docs/` tree.
          required: true
