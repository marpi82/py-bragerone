name: Release

on:
  push:
    tags:
      - "20*"
      - "v20*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect tag and pre-release
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected tag: ${TAG}"

      # Stable tags require the tagged commit on origin/main.
      # Pre-releases require the commit on origin/main or origin/release/*.
      - name: Enforce release channel
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # Explicit refspecs refresh origin/main and origin/release/* (not only FETCH_HEAD).
          git fetch --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/release/*:refs/remotes/origin/release/*"

          on_main=false
          on_release=false
          if git merge-base --is-ancestor HEAD origin/main; then
            on_main=true
          fi
          while IFS= read -r ref; do
            if git merge-base --is-ancestor HEAD "$ref"; then
              on_release=true
              break
            fi
          done < <(git for-each-ref --format="%(refname)" "refs/remotes/origin/release")

          if [[ "$PRERELEASE" == "true" ]]; then
            if [[ "$on_main" == "true" || "$on_release" == "true" ]]; then
              echo "Pre-release tag ${TAG}: commit is on main or release/*"
              exit 0
            fi
            echo "::error::Pre-release tag ${TAG} is not on origin/main or origin/release/*. Cut pre-releases from main or a release train only."
            exit 1
          fi

          if [[ "$on_main" == "true" ]]; then
            echo "Stable tag ${TAG}: commit is on origin/main"
            exit 0
          fi
          echo "::error::Stable tag ${TAG} is not on origin/main. Cut stables from main after merging; from release/* use aN/bN/rcN only."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "latest"
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Build artifacts
        run: uv run hatch build

      - name: Verify build artifacts
        run: |
          ls -lh dist/
          uv tool run twine check dist/*

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          mkdir -p release-assets
          cd dist
          sha256sum *.whl *.tar.gz > ../release-assets/SHA256SUMS

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./
          format: cyclonedx-json
          output-file: release-assets/sbom.cyclonedx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl

      - name: Attest sdist provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: |
            dist/*
            release-assets/*

      - name: Publish to PyPI
        # Stable and pre-release tags both go to PyPI so HA / consumers can pin
        # ``py-bragerone==YYYY.M.NrcN`` without TestPyPI. Trusted Publishing (OIDC).
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            release-assets/SHA256SUMS
            release-assets/sbom.cyclonedx.json
