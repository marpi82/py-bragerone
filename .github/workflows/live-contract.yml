name: Live contract

on:
  workflow_dispatch:
    inputs:
      seed_only:
        description: Overwrite the runner baseline with the current live catalog (force reseed)
        type: boolean
        default: false
  repository_dispatch:
    types: [upstream-catalog-changed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: live-contract
  cancel-in-progress: false

jobs:
  contract:
    name: live catalog contract
    if: github.repository == 'marpi82/py-bragerone'
    runs-on: [self-hosted, Linux, X64, bragerone-live]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --group test --python 3.13

      - name: Run live contract
        id: contract
        env:
          # Manual checkbox force-reseeds immediately. Auto-reseed after compat is a later step.
          SEED_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_only || false }}
        run: |
          mkdir -p reports/live
          extra=()
          if [ "$SEED_ONLY" = "true" ]; then
            extra+=(--seed-only)
          fi
          uv run python scripts/live_contract.py \
            --write-current reports/live/contract.json \
            --write-diffs reports/live/diffs.txt \
            "${extra[@]}"

      - name: Run live compat smoke
        id: compat
        if: success() && steps.contract.outcome == 'success'
        run: |
          uv run python scripts/live_compat_smoke.py \
            --write-json reports/live/compat.json

      - name: Auto-reseed baseline after benign drift
        id: reseed
        if: >
          success()
          && steps.contract.outcome == 'success'
          && steps.compat.outcome == 'success'
          && steps.contract.outputs.matched == 'false'
        run: |
          BASELINE_DIR="${PYBO_BASELINE_DIR:-/var/lib/gha/baselines}"
          mkdir -p "$BASELINE_DIR"
          if [ ! -f reports/live/contract.json ]; then
            echo "missing reports/live/contract.json; cannot auto-reseed" >&2
            exit 1
          fi
          cp reports/live/contract.json "$BASELINE_DIR/live_contract.json"
          echo "Auto-reseeded $BASELINE_DIR/live_contract.json from current contract"
          echo "seeded=true" >> "$GITHUB_OUTPUT"
          echo "reseed_reason=auto_compat_ok" >> "$GITHUB_OUTPUT"

      - name: Summarize
        if: always() && steps.contract.outputs.symbol_count != ''
        env:
          SEEDED: ${{ steps.reseed.outputs.seeded || steps.contract.outputs.seeded }}
          MATCHED: ${{ steps.contract.outputs.matched }}
          SYMBOL_COUNT: ${{ steps.contract.outputs.symbol_count }}
          DIFF_COUNT: ${{ steps.contract.outputs.diff_count }}
          SYMBOLS_ADDED: ${{ steps.contract.outputs.symbols_added }}
          SYMBOLS_REMOVED: ${{ steps.contract.outputs.symbols_removed }}
          PATH_KINDS_CHANGES: ${{ steps.contract.outputs.path_kinds_changes }}
          COMPAT_OK: ${{ steps.compat.outputs.compat_ok }}
          PANEL_COUNT: ${{ steps.compat.outputs.panel_count }}
          SYMBOLS_DESCRIBED: ${{ steps.compat.outputs.symbols_described }}
          RESEED_REASON: ${{ steps.reseed.outputs.reseed_reason }}
          SEED_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_only || false }}
        run: |
          {
            echo "## Live contract"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| seeded | $SEEDED |"
            echo "| matched | $MATCHED |"
            echo "| symbols | $SYMBOL_COUNT |"
            echo "| diffs | $DIFF_COUNT |"
            echo "| symbols added | ${SYMBOLS_ADDED:-0} |"
            echo "| symbols removed | ${SYMBOLS_REMOVED:-0} |"
            echo "| path_kinds changes | ${PATH_KINDS_CHANGES:-0} |"
            echo "| compat_ok | ${COMPAT_OK:-n/a} |"
            echo "| panels | ${PANEL_COUNT:-n/a} |"
            echo "| symbols described | ${SYMBOLS_DESCRIBED:-n/a} |"
            echo "| reseed | ${RESEED_REASON:-none} |"
            echo "| seed_only | $SEED_ONLY |"
            if [ -n "${{ github.event.client_payload.fingerprint }}" ]; then
              echo "| upstream fingerprint | \`${{ github.event.client_payload.fingerprint }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-contract
          path: |
            reports/live/contract.json
            reports/live/diffs.txt
            reports/live/diffs.md
            reports/live/diffs_summary.json
            reports/live/compat.json
          if-no-files-found: ignore
          retention-days: 30

      # Self-hosted bragerone-live has no gh/jq; use the Actions API client instead.
      # Runs after upload so the comment can link the artifact instead of inlining a huge diff.
      - name: Signal live contract result
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SEEDED: ${{ steps.reseed.outputs.seeded || steps.contract.outputs.seeded }}
          MATCHED: ${{ steps.contract.outputs.matched }}
          SYMBOL_COUNT: ${{ steps.contract.outputs.symbol_count }}
          DIFF_COUNT: ${{ steps.contract.outputs.diff_count }}
          SYMBOLS_ADDED: ${{ steps.contract.outputs.symbols_added }}
          SYMBOLS_REMOVED: ${{ steps.contract.outputs.symbols_removed }}
          PATH_KINDS_CHANGES: ${{ steps.contract.outputs.path_kinds_changes }}
          SEED_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_only || false }}
          CONTRACT_OK: ${{ steps.contract.outcome }}
          COMPAT_OK: ${{ steps.compat.outcome == 'success' && (steps.compat.outputs.compat_ok || 'true') || steps.compat.outcome }}
          COMPAT_OUTCOME: ${{ steps.compat.outcome }}
          PANEL_COUNT: ${{ steps.compat.outputs.panel_count }}
          SYMBOLS_DESCRIBED: ${{ steps.compat.outputs.symbols_described }}
          SYMBOLS_RESOLVED: ${{ steps.compat.outputs.symbols_resolved }}
          RESEED_REASON: ${{ steps.reseed.outputs.reseed_reason }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_FP: ${{ github.event.client_payload.fingerprint }}
          UPSTREAM_PREV: ${{ github.event.client_payload.previous }}
          WATCH_RUN_URL: ${{ github.event.client_payload.watch_run_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DIFF_LISTING: reports/live/diffs.txt
          DIFF_PREVIEW_LINES: "20"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const title = '[live-contract] BragerOne structural catalog contract';
            const seeded = process.env.SEEDED || '';
            const matched = process.env.MATCHED || '';
            const contractOk = process.env.CONTRACT_OK || '';
            const compatOutcome = process.env.COMPAT_OUTCOME || '';
            const reseedReason = process.env.RESEED_REASON || '';
            const seedOnly = process.env.SEED_ONLY === 'true';
            const drifted = matched === 'false';
            const compatPassed = compatOutcome === 'success';
            const jobOk = contractOk === 'success' && (compatOutcome === '' || compatPassed);

            let statusLine;
            if (seedOnly) {
              statusLine = compatPassed
                ? 'Live catalog contract overwrote the runner baseline (manual reseed); library compat smoke passed.'
                : 'Live catalog contract overwrote the runner baseline (manual reseed); library compat smoke did not pass.';
            } else if (seeded === 'true' && reseedReason === 'auto_compat_ok') {
              statusLine = 'Live catalog contract reported informational structural drift; library compat smoke passed and the runner baseline was auto-reseeded.';
            } else if (seeded === 'true') {
              statusLine = 'Live catalog contract seeded a new baseline (first success).';
            } else if (drifted && compatPassed) {
              statusLine = 'Live catalog contract reported informational structural drift; library compat smoke passed.';
            } else if (drifted && compatOutcome === 'failure') {
              statusLine = 'Live catalog contract reported structural drift and library compat smoke failed.';
            } else if (matched === 'true' && compatPassed) {
              statusLine = 'Live catalog contract matched the baseline (no structural drift); library compat smoke passed.';
            } else if (matched === 'true' && compatOutcome === 'failure') {
              statusLine = 'Live catalog contract matched the baseline, but library compat smoke failed.';
            } else if (contractOk !== 'success') {
              statusLine = 'Live catalog contract failed (missing env, catalog error, or runner fault).';
            } else {
              statusLine = 'Live catalog contract finished without structured seed/match outputs.';
            }

            const rows = [
              `| trigger | \`${process.env.EVENT_NAME}\` |`,
              `| outcome | \`${jobOk ? 'success' : 'failure'}\` |`,
              `| contract | \`${contractOk || 'n/a'}\` |`,
              `| compat | \`${compatOutcome || 'n/a'}\` |`,
              `| seeded | ${seeded || 'n/a'} |`,
              `| matched | ${matched || 'n/a'} |`,
              `| symbols | ${process.env.SYMBOL_COUNT || 'n/a'} |`,
              `| diffs | ${process.env.DIFF_COUNT || 'n/a'} |`,
              `| symbols added | ${process.env.SYMBOLS_ADDED || '0'} |`,
              `| symbols removed | ${process.env.SYMBOLS_REMOVED || '0'} |`,
              `| path_kinds changes | ${process.env.PATH_KINDS_CHANGES || '0'} |`,
              `| panels | ${process.env.PANEL_COUNT || 'n/a'} |`,
              `| symbols described | ${process.env.SYMBOLS_DESCRIBED || 'n/a'} |`,
              `| symbols resolved | ${process.env.SYMBOLS_RESOLVED || 'n/a'} |`,
              `| reseed | \`${reseedReason || (seedOnly ? 'manual' : 'none')}\` |`,
              `| seed_only | ${process.env.SEED_ONLY || 'n/a'} |`,
            ];
            if (process.env.UPSTREAM_FP) {
              rows.push(`| upstream fingerprint | \`${process.env.UPSTREAM_FP}\` |`);
            }
            if (process.env.UPSTREAM_PREV) {
              rows.push(`| upstream previous | \`${process.env.UPSTREAM_PREV}\` |`);
            }

            let body = [
              statusLine,
              '',
              '| Field | Value |',
              '| --- | --- |',
              ...rows,
              '',
              `Run: ${process.env.RUN_URL}`,
            ].join('\n');
            if (process.env.WATCH_RUN_URL) {
              body += `\nUpstream watch: ${process.env.WATCH_RUN_URL}`;
            }
            body +=
              '\n\nBaseline lives on the runner at `/var/lib/gha/baselines/live_contract.json` (not in git). This issue is separate from `[upstream-assets]`.';

            if (drifted) {
              const { owner, repo } = context.repo;
              let artifactUrl = '';
              try {
                const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                  owner,
                  repo,
                  run_id: context.runId,
                  per_page: 100,
                });
                const artifact = (data.artifacts || []).find((item) => item.name === 'live-contract');
                if (artifact) {
                  artifactUrl = `${process.env.RUN_URL}/artifacts/${artifact.id}`;
                }
              } catch (err) {
                core.warning(`Could not resolve live-contract artifact URL: ${err.message}`);
              }
              if (artifactUrl) {
                body += `\n\nFull structural diff: [live-contract artifact](${artifactUrl}) (\`diffs.txt\`).`;
              } else {
                body += `\n\nFull structural diff: download the \`live-contract\` artifact from the run above (\`diffs.txt\`).`;
              }

              const listingPath = process.env.DIFF_LISTING;
              const previewLimit = Math.max(1, Number.parseInt(process.env.DIFF_PREVIEW_LINES || '20', 10) || 20);
              if (listingPath && fs.existsSync(listingPath)) {
                try {
                  const lines = fs.readFileSync(listingPath, 'utf8').split(/\r?\n/).filter((line) => line.length > 0);
                  if (lines.length) {
                    const preview = lines.slice(0, previewLimit);
                    const omitted = Math.max(0, lines.length - preview.length);
                    const count = process.env.DIFF_COUNT || String(lines.length);
                    let fence = `\`\`\`diff\n--- baseline\n+++ current\n${preview.join('\n')}\n`;
                    if (omitted) {
                      fence += `… truncated, ${omitted} more line(s); see the artifact.\n`;
                    }
                    fence += '```';
                    // GitHub renders <details> collapsed by default (click the summary arrow to expand).
                    body += `\n\n<details>\n<summary>Structural diffs preview (${count})</summary>\n\n${fence}\n</details>\n`;
                  }
                } catch (err) {
                  body += `\n\n_(Could not attach structural diff preview: ${err.message})_`;
                }
              }
            }

            const issueBodyMax = 65536;
            if (body.length > issueBodyMax) {
              body = `${body.slice(0, issueBodyMax - 48)}\n\n… truncated for GitHub comment limit.`;
            }

            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: 'live-contract',
                color: '5319E7',
                description: 'Rolling notice for self-hosted live catalog contract runs',
              });
            } catch (err) {
              if (err.status !== 422) {
                throw err;
              }
            }

            // Match previous gh --limit 50: one page only, skip PRs (listForRepo includes them).
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 50,
              sort: 'created',
              direction: 'desc',
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                labels: ['live-contract'],
                body,
              });
            }
