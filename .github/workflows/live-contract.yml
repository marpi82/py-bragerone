name: Live contract

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-catalog-changed]

permissions:
  contents: read
  issues: write

concurrency:
  group: live-contract
  cancel-in-progress: false

jobs:
  contract:
    name: live catalog contract
    if: github.repository == 'marpi82/py-bragerone'
    runs-on: [self-hosted, Linux, X64, bragerone-live]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --group test --python 3.13

      - name: Run live contract
        id: contract
        run: |
          mkdir -p reports/live
          uv run python scripts/live_contract.py \
            --write-current reports/live/contract.json

      - name: Summarize
        if: always() && steps.contract.outputs.symbol_count != ''
        env:
          SEEDED: ${{ steps.contract.outputs.seeded }}
          MATCHED: ${{ steps.contract.outputs.matched }}
          SYMBOL_COUNT: ${{ steps.contract.outputs.symbol_count }}
          DIFF_COUNT: ${{ steps.contract.outputs.diff_count }}
        run: |
          {
            echo "## Live contract"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| seeded | $SEEDED |"
            echo "| matched | $MATCHED |"
            echo "| symbols | $SYMBOL_COUNT |"
            echo "| diffs | $DIFF_COUNT |"
            if [ -n "${{ github.event.client_payload.fingerprint }}" ]; then
              echo "| upstream fingerprint | \`${{ github.event.client_payload.fingerprint }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Signal live contract result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEEDED: ${{ steps.contract.outputs.seeded }}
          MATCHED: ${{ steps.contract.outputs.matched }}
          SYMBOL_COUNT: ${{ steps.contract.outputs.symbol_count }}
          DIFF_COUNT: ${{ steps.contract.outputs.diff_count }}
          CONTRACT_OK: ${{ steps.contract.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_FP: ${{ github.event.client_payload.fingerprint }}
          UPSTREAM_PREV: ${{ github.event.client_payload.previous }}
          WATCH_RUN_URL: ${{ github.event.client_payload.watch_run_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          command -v gh >/dev/null || { echo "gh is required on the bragerone-live runner" >&2; exit 1; }
          command -v jq >/dev/null || { echo "jq is required on the bragerone-live runner" >&2; exit 1; }
          TITLE='[live-contract] BragerOne structural catalog contract'
          # Prefer structured script outputs over step outcome: drift exits 1 but still
          # publishes matched=false / diff_count>0 for this message.
          if [ "$SEEDED" = "true" ]; then
            STATUS_LINE='Live catalog contract seeded a new baseline (first success or --seed-only).'
          elif [ "$MATCHED" = "false" ]; then
            STATUS_LINE='Live catalog contract reported structural drift against the baseline.'
          elif [ "$MATCHED" = "true" ]; then
            STATUS_LINE='Live catalog contract matched the baseline (no structural drift).'
          elif [ "$CONTRACT_OK" != "success" ]; then
            STATUS_LINE='Live catalog contract failed (missing env, catalog error, or runner fault).'
          else
            STATUS_LINE='Live catalog contract finished without structured seed/match outputs.'
          fi
          TABLE_ROWS=$(cat <<EOF
          | trigger | \`$EVENT_NAME\` |
          | outcome | \`$CONTRACT_OK\` |
          | seeded | ${SEEDED:-n/a} |
          | matched | ${MATCHED:-n/a} |
          | symbols | ${SYMBOL_COUNT:-n/a} |
          | diffs | ${DIFF_COUNT:-n/a} |
          EOF
          )
          if [ -n "$UPSTREAM_FP" ]; then
            TABLE_ROWS+=$'\n'"| upstream fingerprint | \`$UPSTREAM_FP\` |"
          fi
          if [ -n "$UPSTREAM_PREV" ]; then
            TABLE_ROWS+=$'\n'"| upstream previous | \`$UPSTREAM_PREV\` |"
          fi
          BODY=$(cat <<EOF
          $STATUS_LINE

          | Field | Value |
          | --- | --- |
          $TABLE_ROWS

          Run: $RUN_URL
          EOF
          )
          if [ -n "$WATCH_RUN_URL" ]; then
            BODY+=$'\n'"Upstream watch: $WATCH_RUN_URL"
          fi
          BODY+=$'\n\n'"Baseline lives on the runner at \`/var/lib/gha/baselines/live_contract.json\` (not in git). This issue is separate from \`[upstream-assets]\`."
          gh label create live-contract --description "Rolling notice for self-hosted live catalog contract runs" --color 5319E7 || true
          NUMBER=$(gh issue list --state open --limit 50 --json number,title \
            | jq -r --arg title "$TITLE" '.[] | select(.title == $title) | .number' \
            | head -n 1)
          if [ -z "$NUMBER" ]; then
            gh issue create --title "$TITLE" --label live-contract --body "$BODY"
          else
            gh issue comment "$NUMBER" --body "$BODY"
          fi

      - name: Upload contract JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-contract
          path: reports/live/contract.json
          if-no-files-found: ignore
          retention-days: 30
