documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - README.md
          - CHANGELOG.md
          - CONTRIBUTING.md
          - SECURITY.md
          - AGENTS.md
          - DEVELOPMENT.md
          - .github/*.md
          - .github/ISSUE_TEMPLATE/**
          - .github/PULL_REQUEST_TEMPLATE.md


ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**

testing:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**
          - fuzz/**

python:
  - changed-files:
      - any-glob-to-any-file:
          - src/**
          - scripts/**

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - pyproject.toml
          - uv.lock
